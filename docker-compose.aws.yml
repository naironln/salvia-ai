# Production compose for EC2-apps deployment in the Mirai infrastructure.
#
# Differences from docker-compose.prod.yml (the legacy Cloudflare-origin
# self-hosted prod setup):
#  - No Neo4j service. Neo4j lives on EC2-data and is reached via private
#    VPC (NEO4J_URI in .env points at bolt://172.31.35.149:7687).
#  - Backend exposes 8002 on the host (Caddy on EC2-apps routes
#    salvia-ai.com/api/* -> 127.0.0.1:8002; port 8001 is Coin's backend).
#  - Frontend serves the SPA on host port 8082 with nginx.aws.conf
#    (HTTP-only; Caddy terminates TLS; 8081 is Coin's frontend).
#  - All meal images live in the named `meal_images` volume on EC2-apps
#    (preserved across deploys — same as legacy).
#
# /opt/salvia/.env on EC2-apps must contain:
#   NEO4J_URI=bolt://172.31.35.149:7687
#   NEO4J_USER=neo4j
#   NEO4J_PASSWORD=<from secret store>
#   ANTHROPIC_API_KEY=...
#   JWT_SECRET_KEY=<32+ char random>
#   JWT_ALGORITHM=HS256
#   JWT_EXPIRE_MINUTES=10080
#   MEDIA_DIR=/app/media
#   CORS_ORIGINS=https://salvia-ai.com

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - meal_images:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\", timeout=3).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8002:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.aws.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:80"

volumes:
  meal_images:
